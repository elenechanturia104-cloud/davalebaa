<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>პროფილების ძიება — Garigeba.ge</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header class="site-header">
        <a class="logo" href="index.html">გარიგება<span>.ge</span></a>
        <nav class="main-nav">
            <a href="index.html">მთავარი</a>
            <a class="active" href="search.html">ძიება</a>
            <a href="likes.html">მოწონებები</a>
            <a href="messages.html">მიმოწერა</a>
        </nav>
        <div class="header-actions">
            <a class="btn btn-outline" href="dashboard.html">ჩემი ანგარიში</a>
        </div>
        <button class="menu-toggle" aria-label="მენიუს გახსნა" aria-expanded="false">☰</button>
    </header>

    <main class="page-container">
        <div class="page-heading">
            <span class="eyebrow">აღმოაჩინე</span>
            <h1>პროფილების ძიება</h1>
            <p>გამოიყენე ფილტრები და გაეცანი გაზიარებულ ინფორმაციას.</p>
        </div>

        <div class="notice">
            ნაჩვენები პროფილები დემო მონაცემებია და რეალურ ადამიანებს არ წარმოადგენენ.
        </div>

        <form class="panel filter-row" id="searchForm">
            <div class="form-field">
                <label for="cityFilter">ქალაქი</label>
                <select id="cityFilter">
                    <option value="">ყველა ქალაქი</option>
                    <option value="თბილისი">თბილისი</option>
                    <option value="ბათუმი">ბათუმი</option>
                    <option value="ქუთაისი">ქუთაისი</option>
                    <option value="ფოთი">ფოთი</option>
                </select>
            </div>

            <div class="form-field">
                <label for="ageFilter">ასაკი</label>
                <select id="ageFilter">
                    <option value="">ყველა ასაკი</option>
                    <option value="18-24">18–24</option>
                    <option value="25-30">25–30</option>
                    <option value="31-40">31–40</option>
                    <option value="41+">41+</option>
                </select>
            </div>

            <div class="form-field">
                <label for="educationFilter">განათლება</label>
                <select id="educationFilter">
                    <option value="">ყველა</option>
                    <option value="უმაღლესი">უმაღლესი</option>
                    <option value="საშუალო">საშუალო</option>
                    <option value="სტუდენტი">სტუდენტი</option>
                </select>
            </div>

            <button class="btn btn-primary" type="submit">ძიება</button>
        </form>

        <div id="profileResults" class="profile-grid"></div>
    </main>

    <footer class="site-footer">
        <a class="logo" href="index.html">გარიგება<span>.ge</span></a>
        <a href="safety.html">უსაფრთხოება</a>
        <small>© 2026 Garigeba.ge</small>
    </footer>
</body>
</html>
